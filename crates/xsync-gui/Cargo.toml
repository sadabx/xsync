[package]
name = "xsync-gui"
version = "0.2.0"
description = "Fast, native Google Drive Desktop GUI for Linux, Windows, and macOS (built with Slint)"
authors = ["Sadab <sadabsiperkhan@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/sadabx/xsync"
edition = "2021"

[dependencies]
xsync-core = { path = "../xsync-core" }
slint = "1.18"
i-slint-core = "1.18"
rfd = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
slint-build = "1.18"
