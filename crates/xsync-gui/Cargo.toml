[package]
name = "xsync-gui"
version = "0.2.0"
description = "Fast, modern Google Drive Desktop GUI for Linux (built with Tauri v2, Svelte, and Tailwind CSS)"
authors = ["Sadab <sadabsiperkhan@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/sadabx/xsync"
edition = "2021"

[dependencies]
xsync-core = { path = "../xsync-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }
